<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Wayground Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0f172a; }</style>
</head>
<body class="text-white min-h-screen p-8">
    <div class="max-w-4xl mx-auto">
        <div class="flex justify-between items-center mb-10">
            <h1 class="text-3xl font-bold text-purple-400">Wayground Pro</h1>
            <button onclick="logout()" class="text-red-400 hover:text-red-300">Đăng xuất</button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Quét Đáp Án -->
            <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700">
                <h2 class="text-xl font-bold mb-4">Quét Đáp Án</h2>
                <input type="text" id="pin" placeholder="Nhập PIN..." class="w-full bg-slate-900 border border-slate-700 p-3 rounded-lg mb-4 text-center text-2xl font-bold tracking-widest focus:outline-none focus:border-purple-500">
                <button onclick="scan()" id="scanBtn" class="w-full bg-purple-600 hover:bg-purple-700 py-3 rounded-lg font-bold transition">Lấy Dữ Liệu</button>
                <div id="resultBox" class="mt-4 hidden">
                    <button onclick="copyJson()" class="w-full bg-green-600 hover:bg-green-700 py-2 rounded-lg font-bold mb-2">📋 Copy JSON</button>
                </div>
            </div>

            <!-- Thông tin tài khoản -->
            <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700">
                <h2 class="text-xl font-bold mb-4">Tài Khoản</h2>
                <div class="text-lg mb-2">Gói hiện tại: <span id="planName" class="text-purple-400 font-bold uppercase">FREE</span></div>
                <div class="text-slate-400 mb-4">Lượt dùng hôm nay: <span id="usesText" class="text-white font-bold">0/5</span></div>
                
                <h3 class="font-bold text-green-400 mb-2 mt-6">Nâng cấp gói (VietQR)</h3>
                <div class="grid grid-cols-3 gap-2">
                    <button onclick="showQR('50k', 50000)" class="bg-slate-700 hover:bg-slate-600 py-2 rounded text-sm font-bold">50K<br>15 lượt</button>
                    <button onclick="showQR('100k', 100000)" class="bg-slate-700 hover:bg-slate-600 py-2 rounded text-sm font-bold">100K<br>30 lượt</button>
                    <button onclick="showQR('200k', 200000)" class="bg-slate-700 hover:bg-slate-600 py-2 rounded text-sm font-bold">200K<br>Vô hạn</button>
                </div>
            </div>

            <!-- Spawn Bot -->
            <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 col-span-1 md:col-span-2 mt-4">
                <h2 class="text-xl font-bold mb-4 text-orange-400">Spawn Bot (Spam Phòng)</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="text-sm text-slate-400 mb-1 block">Số lượng Bot (Max 10)</label>
                        <input type="number" id="botCount" min="1" max="10" placeholder="VD: 5" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-lg text-white focus:outline-none focus:border-orange-500">
                    </div>
                    <div>
                        <label class="text-sm text-slate-400 mb-1 block">Tên Bot (Tiền tố)</label>
                        <input type="text" id="botPrefix" placeholder="VD: Player" value="Player" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-lg text-white focus:outline-none focus:border-orange-500">
                    </div>
                    <div class="flex items-end">
                        <button onclick="spawnBots()" class="w-full bg-orange-600 hover:bg-orange-700 py-3 rounded-lg font-bold transition">Tạo Bot Vào Phòng</button>
                    </div>
                </div>
                <p class="text-xs text-slate-500 mt-3">Lưu ý: Máy tính sẽ phải chạy ngầm rất nhiều tiến trình Chrome. Hãy tắt bớt các tab không cần thiết để tránh bị treo máy.</p>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) window.location.href = '/login.html'; 
        let currentJson = null;

        async function loadUser() {
            try {
                const res = await fetch('/api/me', { headers: { 'Authorization': `Bearer ${token}` } });
                if (!res.ok) return logout(); 
                const data = await res.json();
                document.getElementById('planName').innerText = data.plan;
                document.getElementById('usesText').innerText = `${data.dailyUses}/${data.maxUses}`;
            } catch (e) { logout(); }
        }
        loadUser();

        async function scan() {
            const pin = document.getElementById('pin').value;
            if (!pin) return Swal.fire('Lỗi', 'Vui lòng nhập PIN', 'error');
            
            Swal.fire({ title: 'Đang quét...', text: 'Vui lòng chờ (khoảng 15s)', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            
            try {
                const res = await fetch('/api/scan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ pin })
                });
                const data = await res.json();
                
                if (res.ok) {
                    currentJson = JSON.stringify(data, null, 2);
                    document.getElementById('resultBox').classList.remove('hidden');
                    Swal.fire('Thành công!', 'Đã lấy dữ liệu đáp án.', 'success');
                    loadUser();
                } else {
                    Swal.fire('Lỗi', data.error, 'error');
                }
            } catch (e) { Swal.fire('Lỗi', 'Mất kết nối server', 'error'); }
        }

        function copyJson() {
            navigator.clipboard.writeText(currentJson);
            Swal.fire('Đã Copy!', 'Dữ liệu JSON đã lưu vào khay nhớ tạm.', 'success');
        }

        async function spawnBots() {
            const pin = document.getElementById('pin').value;
            const count = parseInt(document.getElementById('botCount').value);
            const prefix = document.getElementById('botPrefix').value;

            if (!pin) return Swal.fire('Lỗi', 'Vui lòng nhập PIN phòng ở ô phía trên', 'error');
            if (!count || count < 1 || count > 10) return Swal.fire('Lỗi', 'Số lượng bot phải từ 1 đến 10', 'error');

            Swal.fire({ title: 'Đang tạo Bot...', text: `Hệ thống đang đưa ${count} bot vào phòng. Quá trình này diễn ra ngầm, vui lòng đợi!`, allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            try {
                const res = await fetch('/api/spawn', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ pin, count, prefix })
                });
                const data = await res.json();
                
                if (res.ok) {
                    Swal.fire('Đã gửi lệnh!', data.message, 'success');
                    document.getElementById('botCount').value = '';
                } else {
                    Swal.fire('Lỗi', data.error, 'error');
                }
            } catch (e) { 
                Swal.fire('Lỗi', 'Mất kết nối server', 'error'); 
            }
        }

        function showQR(plan, amount) {
            const accountName = encodeURIComponent('NGUYEN TRONG UY VU');
            const addInfo = encodeURIComponent(`nap ${plan} ${localStorage.getItem('username') || ''}`);
            const qrUrl = `https://img.vietqr.io/image/MB-324121010-compact2.png?amount=${amount}&addInfo=${addInfo}&accountName=${accountName}`;

            Swal.fire({
                title: `Thanh toán gói ${plan}`,
                html: `
                    <p class="mb-2">Quét mã QR để thanh toán <b>${amount.toLocaleString()} VNĐ</b></p>
                    <img src="${qrUrl}" class="mx-auto rounded-xl shadow-lg mb-4 w-64">
                    <p class="text-sm text-gray-500">Sau khi chuyển khoản, bấm xác nhận để Admin duyệt.</p>
                `,
                showCancelButton: true,
                confirmButtonText: 'Tôi đã chuyển khoản',
                cancelButtonText: 'Hủy',
                confirmButtonColor: '#8b5cf6'
            }).then(async (result) => {
                if (result.isConfirmed) {
                    const res = await fetch('/api/payment/request', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                        body: JSON.stringify({ plan, amount })
                    });
                    const data = await res.json();
                    if (res.ok) Swal.fire('Đã gửi!', data.message, 'success');
                }
            });
        }

        function logout() {
            localStorage.clear();
            window.location.href = '/login.html';
        }
    </script>
</body>
</html>
